<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tandem — PandemApps</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f1e7;
    --ink: #1f2a33;
    --accent: #1c6e8c;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  main { max-width: 480px; }
  h1 { font-size: 2rem; margin-bottom: 4px; }
  p.subtitle { opacity: 0.7; margin-top: 0; margin-bottom: 24px; }
  p { line-height: 1.5; }
  a { color: var(--accent); font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
  footer { margin-top: 32px; font-size: 0.8rem; opacity: 0.55; }
</style>
</head>
<body>
<main>
  <h1>Tandem</h1>
  <p class="subtitle">Come Quando Fuori Piove</p>
  <p>Il classico gioco di carte a prese e dichiarazioni, in salotto o in spiaggia, ora sul telefono.</p>
  <p>Sviluppato da PandemApps.</p>
  <footer>&copy; PandemApps</footer>
</main>
</body>
</html>
